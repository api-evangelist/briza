aid: briza
name: Briza
description: >-
  Briza helps insurance carriers stop losing premium to slow integrations and
  submission errors, treating carrier API reliability as a manufacturing
  discipline. A team of Six Sigma Black Belts, Briza applies Kaizen principles
  to API connectivity across commercial insurance, focusing on submission
  integrity and moving premium reliably between distributors and carriers. Briza
  is a 500 Global portfolio company. The team also maintains open-source
  developer libraries under the briza-insurance GitHub org, including illogical
  (a JSON DSL rules engine) and wegood (a validation library). Briza does not
  currently publish a public developer API or OpenAPI specification.
